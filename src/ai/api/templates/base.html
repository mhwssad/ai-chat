<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AI Chat Workbench{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/app.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      {% include "includes/sidebar.html" %}
      <main class="main-content">
        {% if not hide_page_header %}
        <header class="page-header">
          <h1>{{ page_title }}</h1>
          {% if page_subtitle %}<p class="page-subtitle">{{ page_subtitle }}</p>{% endif %}
        </header>
        {% endif %}
        {% include "includes/flash.html" %}
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="/static/js/base.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
