<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | AI Chat</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/chat">
                <span class="brand-mark">AI</span>
                <div>
                    <strong>AI Chat</strong>
                    <p>FastAPI + Jinja2 工作台</p>
                </div>
            </a>
            <nav class="nav">
                {% for item in nav_items %}
                <a href="{{ item.href }}" class="nav-link {% if current_page == item.key %}active{% endif %}">
                    {{ item.label }}
                </a>
                {% endfor %}
            </nav>
        </aside>
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>{{ page_title }}</h1>
                    <p>{{ page_subtitle | default("当前提供服务端渲染的最小 UI 骨架，后续可平滑扩展为更完整的 Web 前端。") }}</p>
                </div>
            </header>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
